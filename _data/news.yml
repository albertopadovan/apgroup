- date: July 20, 2026
  headline: "Federico and Alberto attended the 17th World Congress on Computational Mechanics (WCCM) in Munich, Germany.
    Congratulations to Federico on his first conference presentation, where he discussed recent work in collaboration with Irina Tezaur and Anthony Gruber (Sandia National Labs)
    on a variationally-consistent non-intrusive model reduction formulation for Hamiltonian systems."

- date: July 1, 2026
  headline: Alberto joins the Mathematical Sciences department at New Jersey Institute of Technology on a 0% appointment.

- date: June 2, 2026
  headline: "Our paper <i>Toward adaptive non-intrusive reduced-order models: design and challenges</i> is now available in Structural and Multidisciplinary Optimization.
    This work was done in collaboration with Prof. Karthik Duraisamy at the University of Michigan and his PhD student Amirpasha Hedayat.
    You can find the paper <a href='https://doi.org/10.1007/s00158-026-04355-1'>here</a>."

- date: May 20, 2026
  headline: "Dr. Mark Fasano joins the group as a postdoctoral research associate. Welcome, Mark!"

- date: March 22, 2026
  headline: "Our preprint <i>GasNiTROM: Model Reduction via Non-Intrusive Optimization of Oblique Projection Operators and Guaranteed-Stable Latent-Space Dynamics</i> is now available on arXiv.
    This was joint work with Cole Errico and Prof. Dan Bodony at the University of Illinois Urbana-Champaign.
    You can find the preprint <a href='https://arxiv.org/abs/2603.21254'>here</a>."

- date: February 11, 2026
  headline: "Our preprint <i>Toward Adaptive Non-Intrusive Reduced-Order Models: Design and Challenges</i> is now available on arXiv.
    This work was done in collaboration with Prof. Karthik Duraisamy at the University of Michigan and his PhD student Amirpasha Hedayat.
    You can find the preprint <a href='https://arxiv.org/abs/2602.11378'>here</a>."

- date: January 15, 2026
  headline: "Our paper <i>Petrov–Galerkin model reduction for collisional–radiative argon plasma</i> was
    selected as Editor's Pick in Physics of Plasmas. Congratulations to Dr. Ivan Zanardi
    (formerly University of Illinois Urbana-Champaign, currently at PhysicsX) for the great work!
    You can find the paper <a href='/apgroup/papers/ZanardiEtAl_PoP2026.pdf'>here</a>."

- date: November 22, 2025
  headline: "We attended the annual APS DFD conference in Houston, TX."

- date: October 15, 2025
  headline: "Paper on stability analysis of compressible boundary layers over 
    submlimating surfaces accepted for publication in the Journal of Fluid Mechanics.
    This was work in collaboration with Blaine Vollmer and Dan Bodony at the University of Illinois
    Urbana-Champaign."

- date: September 30, 2025
  headline: "Alberto gave an invited talk at the Fall Colloquium Seminar Series in the 
    Department of Mechanical and Aerospace Engineering at Cornell University."

- date: September 16, 2025
  headline: "Alberto gave an invited talk at the Applied Mathematics Seminar Series at
    SISSA (International School of Advanced Studies) in Trieste, Italy."

- date: September 5, 2025
  headline: "Alberto gave an invited talk at the Mathematical Sciences Departmental Colloquium at
    New Jersey Institute of Technology."

- date: September 2, 2025
  headline: "Alberto joins the Department of Mechanical and Industrial Engineering at 
