- date: February 11, 2026
  headline: "Our preprint <i>Toward Adaptive Non-Intrusive Reduced-Order Models: Design and Challenges</i> is now available on arXiv.
    This work was done in collaboration with Prof. Karthik Duraisamy at the University of Michigan and his PhD student Amirpasha Hedayat.
    You can find the preprint <a href='https://arxiv.org/abs/2602.11378'>here</a>."

- date: January 15, 2026
  headline: "Our paper <i>Petrov–Galerkin model reduction for collisional–radiative argon plasma</i> was
    selected as Editor's Pick in Physics of Plasmas. Congratulations to Dr. Ivan Zanardi
    (formerly University of Illinois Urbana-Champaign, currently at PhysicsX) for the great work!
    You can find the paper <a href='/apgroup/papers/ZanardiEtAl_PoP2026.pdf'>here</a>."

- date: November 22, 2025
  headline: "We attended the annual APS DFD conference in Houston, TX."

- date: October 15, 2025
  headline: "Paper on stability analysis of compressible boundary layers over 
    submlimating surfaces accepted for publication in the Journal of Fluid Mechanics.
    This was work in collaboration with Blaine Vollmer and Dan Bodony at the University of Illinois
    Urbana-Champaign."

