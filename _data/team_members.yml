  about: Adi Jha is an undergraduate student studying Aerospace Engineering and Electrical Engineering at the University of Illinois Urbana-Champaign. 
    He has conducted research in astrodynamics, including work on coupled gravity assist trajectories using Lambert's problem. 
    His current work focuses on specific impulse scaling, electromagnetic propulsion, and plasma dynamics in nonlinear and turbulent regimes. 
    Outside of research, Adi enjoys piano, learning languages, and chess.



